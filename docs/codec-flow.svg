<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-labelledby="title desc">
  <title id="title">text-serdes zlib codec flow</title>
  <desc id="desc">Encode flow: bytes, zlib, AES-GCM, DC1 nonce, Base91, text. Decode flow reverses the sequence.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
    <style>
      .bg { fill: #e5e7eb; }
      .title { fill: #111827; font: 700 18px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .label { fill: #111827; font: 700 14px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; rx: 6; }
      .codec { fill: #eef2ff; stroke: #6366f1; stroke-width: 1.5; rx: 6; }
      .crypto { fill: #ecfeff; stroke: #0891b2; stroke-width: 1.5; rx: 6; }
      .wire { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.5; rx: 6; }
      .arrow { stroke: #374151; stroke-width: 1.7; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="900" height="250" rx="10"/>

  <text class="title" x="30" y="40">Encode</text>
  <rect class="box" x="30" y="62" width="88" height="42"/>
  <text class="label" x="74" y="88" text-anchor="middle">bytes</text>
  <rect class="codec" x="174" y="62" width="88" height="42"/>
  <text class="label" x="218" y="88" text-anchor="middle">zlib</text>
  <rect class="crypto" x="318" y="62" width="104" height="42"/>
  <text class="label" x="370" y="88" text-anchor="middle">AES-GCM</text>
  <rect class="wire" x="478" y="62" width="110" height="42"/>
  <text class="label" x="533" y="88" text-anchor="middle">DC1+nonce</text>
  <rect class="wire" x="644" y="62" width="84" height="42"/>
  <text class="label" x="686" y="88" text-anchor="middle">Base91</text>
  <rect class="box" x="784" y="62" width="88" height="42"/>
  <text class="label" x="828" y="88" text-anchor="middle">text</text>

  <path class="arrow" d="M118 83 H174"/>
  <path class="arrow" d="M262 83 H318"/>
  <path class="arrow" d="M422 83 H478"/>
  <path class="arrow" d="M588 83 H644"/>
  <path class="arrow" d="M728 83 H784"/>

  <text class="title" x="30" y="160">Decode</text>
  <rect class="box" x="30" y="182" width="88" height="42"/>
  <text class="label" x="74" y="208" text-anchor="middle">text</text>
  <rect class="wire" x="174" y="182" width="84" height="42"/>
  <text class="label" x="216" y="208" text-anchor="middle">Base91</text>
  <rect class="wire" x="314" y="182" width="110" height="42"/>
  <text class="label" x="369" y="208" text-anchor="middle">DC1+nonce</text>
  <rect class="crypto" x="480" y="182" width="104" height="42"/>
  <text class="label" x="532" y="208" text-anchor="middle">AES-GCM</text>
  <rect class="codec" x="640" y="182" width="88" height="42"/>
  <text class="label" x="684" y="208" text-anchor="middle">zlib</text>
  <rect class="box" x="784" y="182" width="88" height="42"/>
  <text class="label" x="828" y="208" text-anchor="middle">bytes</text>

  <path class="arrow" d="M118 203 H174"/>
  <path class="arrow" d="M258 203 H314"/>
  <path class="arrow" d="M424 203 H480"/>
  <path class="arrow" d="M584 203 H640"/>
  <path class="arrow" d="M728 203 H784"/>
</svg>
