<svg xmlns="http://www.w3.org/2000/svg" width="820" height="250" viewBox="0 0 820 250" role="img" aria-labelledby="title desc">
  <title id="title">text-serdes zlib codec flow</title>
  <desc id="desc">Encode flow: bytes, zlib, encrypt, Base91, text. Decode flow: text, Base91, decrypt, zlib, bytes.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
    <style>
      .bg { fill: #94a3b8; }
      .title { fill: #111827; font: 700 18px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .label { fill: #111827; font: 700 15px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; rx: 6; }
      .codec { fill: #eef2ff; stroke: #6366f1; stroke-width: 1.5; rx: 6; }
      .crypto { fill: #ecfeff; stroke: #0891b2; stroke-width: 1.5; rx: 6; }
      .wire { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.5; rx: 6; }
      .arrow { stroke: #374151; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="820" height="250" rx="10"/>

  <text class="title" x="410" y="40" text-anchor="middle">Encode</text>
  <rect class="box" x="30" y="62" width="96" height="42"/>
  <text class="label" x="78" y="79" text-anchor="middle">string/</text>
  <text class="label" x="78" y="96" text-anchor="middle">file</text>
  <rect class="codec" x="186" y="62" width="96" height="42"/>
  <text class="label" x="234" y="88" text-anchor="middle">zlib</text>
  <rect class="crypto" x="342" y="62" width="96" height="42"/>
  <text class="label" x="390" y="88" text-anchor="middle">Encrypt</text>
  <rect class="wire" x="498" y="62" width="96" height="42"/>
  <text class="label" x="546" y="88" text-anchor="middle">Base91</text>
  <rect class="box" x="654" y="62" width="96" height="42"/>
  <text class="label" x="702" y="88" text-anchor="middle">text</text>

  <path class="arrow" d="M126 83 H186"/>
  <path class="arrow" d="M282 83 H342"/>
  <path class="arrow" d="M438 83 H498"/>
  <path class="arrow" d="M594 83 H654"/>

  <text class="title" x="410" y="160" text-anchor="middle">Decode</text>
  <rect class="box" x="30" y="182" width="96" height="42"/>
  <text class="label" x="78" y="208" text-anchor="middle">text</text>
  <rect class="wire" x="186" y="182" width="96" height="42"/>
  <text class="label" x="234" y="208" text-anchor="middle">Base91</text>
  <rect class="crypto" x="342" y="182" width="96" height="42"/>
  <text class="label" x="390" y="208" text-anchor="middle">Decrypt</text>
  <rect class="codec" x="498" y="182" width="96" height="42"/>
  <text class="label" x="546" y="208" text-anchor="middle">zlib</text>
  <rect class="box" x="654" y="182" width="96" height="42"/>
  <text class="label" x="702" y="199" text-anchor="middle">stdout/</text>
  <text class="label" x="702" y="216" text-anchor="middle">file</text>

  <path class="arrow" d="M126 203 H186"/>
  <path class="arrow" d="M282 203 H342"/>
  <path class="arrow" d="M438 203 H498"/>
  <path class="arrow" d="M594 203 H654"/>
</svg>
