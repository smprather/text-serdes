<svg xmlns="http://www.w3.org/2000/svg" width="980" height="300" viewBox="0 0 980 300" role="img" aria-labelledby="title desc">
  <title id="title">text-serdes codec flow</title>
  <desc id="desc">Encode flow: bytes to shoco and zlib, pick minimum, add method, encrypt, add DC3 nonce, Base91, text. Decode flow reverses the sequence.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { fill: #111827; font: 700 18px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .label { fill: #111827; font: 700 14px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .sub { fill: #4b5563; font: 600 12px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; rx: 6; }
      .branch { fill: #eef2ff; stroke: #6366f1; stroke-width: 1.5; rx: 6; }
      .crypto { fill: #ecfeff; stroke: #0891b2; stroke-width: 1.5; rx: 6; }
      .wire { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.5; rx: 6; }
      .arrow { stroke: #374151; stroke-width: 1.7; fill: none; marker-end: url(#arrow); }
      .thin { stroke: #6b7280; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="980" height="300" rx="10"/>

  <text class="title" x="30" y="38">Encode</text>
  <rect class="box" x="30" y="60" width="88" height="42"/>
  <text class="label" x="74" y="86" text-anchor="middle">bytes</text>

  <rect class="branch" x="168" y="42" width="92" height="38"/>
  <text class="label" x="214" y="66" text-anchor="middle">shoco</text>
  <rect class="branch" x="168" y="100" width="92" height="38"/>
  <text class="label" x="214" y="124" text-anchor="middle">zlib</text>

  <rect class="branch" x="310" y="60" width="78" height="42"/>
  <text class="label" x="349" y="86" text-anchor="middle">min</text>

  <rect class="box" x="438" y="60" width="78" height="42"/>
  <text class="label" x="477" y="86" text-anchor="middle">S/Z</text>

  <rect class="crypto" x="566" y="60" width="104" height="42"/>
  <text class="label" x="618" y="86" text-anchor="middle">AES-GCM</text>

  <rect class="wire" x="720" y="60" width="116" height="42"/>
  <text class="label" x="778" y="86" text-anchor="middle">DC3+nonce</text>

  <rect class="wire" x="866" y="60" width="84" height="42"/>
  <text class="label" x="908" y="86" text-anchor="middle">Base91</text>

  <path class="thin" d="M118 78 C140 78 140 61 168 61"/>
  <path class="thin" d="M118 84 C140 84 140 119 168 119"/>
  <path class="thin" d="M260 61 C284 61 284 78 310 78"/>
  <path class="thin" d="M260 119 C284 119 284 86 310 86"/>
  <path class="arrow" d="M388 81 H438"/>
  <path class="arrow" d="M516 81 H566"/>
  <path class="arrow" d="M670 81 H720"/>
  <path class="arrow" d="M836 81 H866"/>
  <text class="sub" x="908" y="122" text-anchor="middle">text</text>

  <text class="title" x="30" y="182">Decode</text>
  <rect class="wire" x="30" y="204" width="84" height="42"/>
  <text class="label" x="72" y="230" text-anchor="middle">text</text>

  <rect class="wire" x="158" y="204" width="84" height="42"/>
  <text class="label" x="200" y="230" text-anchor="middle">Base91</text>

  <rect class="wire" x="286" y="204" width="116" height="42"/>
  <text class="label" x="344" y="230" text-anchor="middle">DC3+nonce</text>

  <rect class="crypto" x="446" y="204" width="104" height="42"/>
  <text class="label" x="498" y="230" text-anchor="middle">AES-GCM</text>

  <rect class="box" x="594" y="204" width="78" height="42"/>
  <text class="label" x="633" y="230" text-anchor="middle">S/Z</text>

  <rect class="branch" x="720" y="180" width="92" height="38"/>
  <text class="label" x="766" y="204" text-anchor="middle">shoco</text>
  <rect class="branch" x="720" y="238" width="92" height="38"/>
  <text class="label" x="766" y="262" text-anchor="middle">zlib</text>

  <rect class="box" x="862" y="204" width="88" height="42"/>
  <text class="label" x="906" y="230" text-anchor="middle">bytes</text>

  <path class="arrow" d="M114 225 H158"/>
  <path class="arrow" d="M242 225 H286"/>
  <path class="arrow" d="M402 225 H446"/>
  <path class="arrow" d="M550 225 H594"/>
  <path class="thin" d="M672 218 C696 218 696 199 720 199"/>
  <path class="thin" d="M672 232 C696 232 696 257 720 257"/>
  <path class="thin" d="M812 199 C838 199 838 218 862 218"/>
  <path class="thin" d="M812 257 C838 257 838 232 862 232"/>
</svg>
