[project]
name = "text-serdes"
version = "0.1.0"
description = "Mangle and serialize text for easy transport over copy/paste interfaces"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "base91>=1.0.1",
    "click>=8.4.1",
    "cryptography>=48.0.0",
    "rich-click>=1.9.8",
]

[project.scripts]
enc = "text_serdes.cli:enc_main"
dec = "text_serdes.cli:dec_main"

[dependency-groups]
dev = [
    "hatchling>=1.28.0",
    "pytest>=9.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/text_serdes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
